<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NuitClaire</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Les trois polices sont dans la feuille de style, que le navigateur ne
         lit qu'apres avoir telecharge le bundle : sans ce prechargement, le
         premier rendu se fait dans la police de repli puis saute. Le
         `crossorigin` est obligatoire meme pour un fichier du meme domaine,
         les polices etant toujours chargees en mode CORS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/familjen-grotesk.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/atkinson-hyperlegible-next.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/atkinson-hyperlegible-mono.woff2" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS ignore le manifeste : ces deux meta font l'equivalent (ouverture
         en plein ecran depuis l'ecran d'accueil, barre d'etat sombre). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a090c" />
    <script>
      // Applique le theme avant le premier rendu React, pour eviter un
      // flash du mauvais theme au chargement.
      (function () {
        try {
          var saved = localStorage.getItem("nc-theme");
          var known = { light: "#f6f4f8", dark: "#0a090c", night: "#000000" };
          var theme = known[saved] ? saved
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          // La couleur de la barre systeme (appli installee) suit le theme.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", known[theme]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
